name = "kumbh-cloud-dashbaord"
main = "worker/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "cleanfleet-d1"
database_id = "cf139961-dc6e-4ad7-a2bd-65e3468138fb"
migrations_dir = "migrations"

[vars]
DEFAULT_VEHICLE_ID = "CF-BIKE-001"
ROUTE_DEVIATION_THRESHOLD_METERS = "75"
STALE_AFTER_SECONDS = "90"
DELAYED_AFTER_SECONDS = "30"

